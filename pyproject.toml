[project]
name = "blog"
version = "0.1.0"
description = "Python environment for executing blog post code chunks (Quarto + Jupyter engine)."
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
]

[tool.uv]
package = false
